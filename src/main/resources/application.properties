spring.application.name=erick

server.error.include-stacktrace=never
server.error.include-message=always


# 1. Bật Virtual Threads cho Java 21
spring.threads.virtual.enabled=true

# 2. Cấu hình H2 Database
spring.datasource.url=jdbc:h2:file:./data/testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Cho phép vào trình quản lý DB qua trình duyệt: localhost:8080/h2-console
spring.h2.console.enabled=true

# 3. Định dạng Log để in ra RequestID (traceId)
logging.pattern.console=%d{HH:mm:ss} [%thread] %X{traceId} %-5level %logger{36} - %msg%n


external.portcontrol.base-url=${PORTCONTROL_URL:http://localhost:80/api/portcontrol}
external.portcontrol.api-key=${PORTCONTROL_KEY:my-default-key}